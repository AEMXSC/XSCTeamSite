name: AEM Code Purge

on:
  push:
    branches: [main]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Purge changed code files from AEM CDN
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if [ -z "$CHANGED" ]; then
            echo "No changed files detected."
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          echo "$CHANGED" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://admin.hlx.page/code/AEMXSC/XSCTeamSite/main/$file")
            echo "Purged /$file → HTTP $STATUS"
          done
